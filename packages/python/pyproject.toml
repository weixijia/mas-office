[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "mas-office"
version = "0.2.1"
description = "Show any multi-agent system's team live in the MAS Office panel: a tiny event emitter, reducer and snapshot writer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MAS Office contributors" }]
keywords = ["multi-agent", "agents", "observability", "visualization", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
openai-agents = ["openai-agents"]
langgraph = ["langgraph"]
claude-agent-sdk = ["claude-agent-sdk"]
dev = ["pytest>=7"]

[project.urls]
repository = "https://github.com/weixijia/mas-office"
homepage = "https://github.com/weixijia/mas-office"
documentation = "https://github.com/weixijia/mas-office/tree/main/spec"

[project.scripts]
mas-office-py = "mas_office.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mas_office"]

[tool.pytest.ini_options]
testpaths = ["tests"]
